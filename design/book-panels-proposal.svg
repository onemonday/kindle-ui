<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="1448"><rect width="1072" height="1448" fill="white"/><text x="38" y="57" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#171717">← Library</text><text x="1034" y="57" font-family="Arial" font-size="35" font-weight="400" text-anchor="end" fill="#171717">×</text><path d="M38 87 L1034 87" stroke="#d0d0d0" stroke-width="1"/><g transform="translate(135 108) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3 M18 12h39"/><path d="M4 30h3 M18 30h39"/><path d="M4 48h3 M18 48h39"/></g><text x="158" y="190" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#171717">Table of contents</text><g transform="translate(387 108) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h30v54L30 45 15 57Z"/></g><text x="410" y="190" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#171717">Bookmarks</text><g transform="translate(639 108) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="22" height="22" rx="1"/><rect x="4" y="34" width="22" height="22" rx="1"/><rect x="34" y="4" width="22" height="22" rx="1"/><rect x="34" y="34" width="22" height="22" rx="1"/></g><text x="662" y="190" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#171717">Page browser</text><text x="914" y="145" font-family="Arial" font-size="39" font-weight="400" text-anchor="middle" fill="#171717">Aa</text><text x="914" y="190" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#171717">Layout settings</text><path d="M0 222 L1072 222" stroke="#777" stroke-width="1"/><text x="58" y="311" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Утром он вернулся к реке. На другом берегу</text><text x="58" y="364" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">ещё лежал туман, и только верхушки деревьев</text><text x="58" y="417" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">выступали над ним. Он остановился у старой</text><text x="58" y="470" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">пристани и прислушался к плеску воды.</text><text x="58" y="523" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="576" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">В кармане осталось письмо, которое он так</text><text x="58" y="629" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">и не решился открыть вчера. Теперь спешить</text><text x="58" y="682" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">было некуда. Он сел на край деревянного</text><text x="58" y="735" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">настила и развернул сложенный вдвое лист.</text><text x="58" y="788" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="841" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Первые строки были написаны знакомым</text><text x="58" y="894" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">почерком. Он улыбнулся и начал читать.</text><text x="58" y="947" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="1000" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Всё вокруг было тихо. Лишь изредка ветер</text><text x="58" y="1053" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">касался воды, оставляя на ней длинные</text><text x="58" y="1106" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">полосы, которые медленно исчезали.</text><path d="M0 1244 L1072 1244" stroke="#777" stroke-width="1"/><text x="42" y="1295" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" fill="#171717">Page 369 of 810</text><text x="1030" y="1295" font-family="Arial" font-size="26" font-weight="400" text-anchor="end" fill="#171717">46%</text><rect x="44" y="1330" width="984" height="8" rx="4" fill="#d6d6d6"/><rect x="44" y="1330" width="453" height="8" rx="4" fill="#222"/><text x="536" y="1400" font-family="Arial" font-size="26" font-weight="400" text-anchor="middle" fill="#171717">Skim document  ›</text></svg>