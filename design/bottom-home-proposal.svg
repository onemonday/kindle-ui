<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="1448" viewBox="0 0 1072 1448"><rect width="1072" height="1448" fill="#fff"/><text x="58" y="92" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">Утром он вернулся к реке. На другом берегу</text><text x="58" y="145" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">ещё лежал туман, и только верхушки деревьев</text><text x="58" y="198" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">выступали над ним. Он остановился у старой</text><text x="58" y="251" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">пристани и прислушался к плеску воды.</text><text x="58" y="304" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555"></text><text x="58" y="357" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">В кармане осталось письмо, которое он так</text><text x="58" y="410" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">и не решился открыть вчера. Теперь спешить</text><text x="58" y="463" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">было некуда. Он сел на край деревянного</text><text x="58" y="516" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">настила и развернул сложенный вдвое лист.</text><text x="58" y="569" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555"></text><text x="58" y="622" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">Первые строки были написаны знакомым</text><text x="58" y="675" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#555">почерком. Он улыбнулся и начал читать.</text><rect y="750" width="1072" height="698" fill="white"/><path d="M0 750 H1072" stroke="#444" stroke-width="1.5"/><text x="38" y="809" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#171717">← Library</text><text x="536" y="809" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#171717">Book</text><path d="M0 842 H1072" stroke="#999" stroke-width="1"/><g transform="translate(247 892)" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3 M18 12h39"/><path d="M4 30h3 M18 30h39"/><path d="M4 48h3 M18 48h39"/></g><text x="277" y="998" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#171717">Table of contents</text><g transform="translate(765 892)" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h30v54L30 45 15 57Z"/></g><text x="795" y="998" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#171717">Bookmarks</text><g transform="translate(247 1101)" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="22" height="22" rx="1"/><rect x="4" y="34" width="22" height="22" rx="1"/><rect x="34" y="4" width="22" height="22" rx="1"/><rect x="34" y="34" width="22" height="22" rx="1"/></g><text x="277" y="1207" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#171717">Page browser</text><g transform="translate(765 1101)" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="5" width="28" height="50" rx="2"/><path d="M7 13v34 M55 13v34 M23 17h16 M23 25h16 M23 33h10 M22 45h18"/></g><text x="795" y="1207" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#171717">Skim document</text><path d="M38 1052 H1034" stroke="#d0d0d0" stroke-width="1"/><path d="M38 1262 H1034" stroke="#999" stroke-width="1"/><text x="67" y="1360" font-family="Arial" font-size="42" font-weight="400" text-anchor="start" fill="#171717">Aa</text><text x="160" y="1339" font-family="Arial" font-size="29" font-weight="700" text-anchor="start" fill="#171717">Layout settings</text><text x="160" y="1382" font-family="Arial" font-size="23" font-weight="400" text-anchor="start" fill="#666">Font, spacing, margins and more</text><text x="1001" y="1363" font-family="Arial" font-size="42" font-weight="400" text-anchor="middle" fill="#171717">›</text></svg>