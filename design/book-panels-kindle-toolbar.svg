<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="1448"><rect width="1072" height="1448" fill="white"/><text x="38" y="37" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#171717">08:51</text><path d="M496 22l40 8 40-8" fill="none" stroke="#444" stroke-width="3"/><path d="M887 23q15-13 30 0 M892 29q10-9 20 0 M898 35q4-4 8 0" fill="none" stroke="#444" stroke-width="2"/><rect x="977" y="16" width="52" height="23" fill="none" stroke="#444" stroke-width="2"/><rect x="981" y="20" width="40" height="15" fill="#444"/><path d="M1031 23v9" stroke="#444" stroke-width="4"/><text x="966" y="36" font-family="Arial" font-size="21" font-weight="400" text-anchor="end" fill="#171717">92%</text><g transform="translate(0 55)"><text x="38" y="67" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#171717">← Library</text><text x="607" y="67" font-family="Arial" font-size="32" font-weight="400" text-anchor="middle" fill="#171717">Aa</text><g transform="translate(691 32) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3 M18 12h39"/><path d="M4 30h3 M18 30h39"/><path d="M4 48h3 M18 48h39"/></g><g transform="translate(798 32) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h30v54L30 45 15 57Z"/></g><g transform="translate(905 32) scale(.77)" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="22" height="22" rx="1"/><rect x="4" y="34" width="22" height="22" rx="1"/><rect x="34" y="4" width="22" height="22" rx="1"/><rect x="34" y="34" width="22" height="22" rx="1"/></g><text x="1031" y="66" font-family="Arial" font-size="32" font-weight="400" text-anchor="middle" fill="#171717">×</text><path d="M0 108 L1072 108" stroke="#999" stroke-width="1"/><text x="38" y="166" font-family="Arial" font-size="28" font-weight="700" text-anchor="start" fill="#171717">The River — Chapter One</text><path d="M0 204 L1072 204" stroke="#777" stroke-width="1"/></g><text x="58" y="311" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Утром он вернулся к реке. На другом берегу</text><text x="58" y="364" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">ещё лежал туман, и только верхушки деревьев</text><text x="58" y="417" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">выступали над ним. Он остановился у старой</text><text x="58" y="470" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">пристани и прислушался к плеску воды.</text><text x="58" y="523" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="576" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">В кармане осталось письмо, которое он так</text><text x="58" y="629" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">и не решился открыть вчера. Теперь спешить</text><text x="58" y="682" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">было некуда. Он сел на край деревянного</text><text x="58" y="735" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">настила и развернул сложенный вдвое лист.</text><text x="58" y="788" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="841" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Первые строки были написаны знакомым</text><text x="58" y="894" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">почерком. Он улыбнулся и начал читать.</text><text x="58" y="947" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444"></text><text x="58" y="1000" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">Всё вокруг было тихо. Лишь изредка ветер</text><text x="58" y="1053" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">касался воды, оставляя на ней длинные</text><text x="58" y="1106" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start" fill="#444">полосы, которые медленно исчезали.</text><path d="M0 1244 L1072 1244" stroke="#777" stroke-width="1"/><text x="42" y="1295" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" fill="#171717">Page 369 of 810</text><text x="1030" y="1295" font-family="Arial" font-size="26" font-weight="400" text-anchor="end" fill="#171717">46%</text><rect x="44" y="1330" width="984" height="8" rx="4" fill="#d6d6d6"/><rect x="44" y="1330" width="453" height="8" rx="4" fill="#222"/><text x="536" y="1400" font-family="Arial" font-size="26" font-weight="400" text-anchor="middle" fill="#171717">Skim document  ›</text></svg>